<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Our Story · Digital Memory Archive & Birthday Celebration">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Our Love Story">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Preconnect & Unified Stylesheet (High-Speed Browser Pre-caching) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@400..700&family=Cinzel:wght@600;900&family=Comic+Neue:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Great+Vibes&family=Noto+Color+Emoji&family=Noto+Sans:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <title>Our Story · Srinithi & Selvakumar</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Instant Zero-Delay Splash Screen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FAF7F2;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #FFFDF9 0%, #FAF7F2 60%, #F3EDE4 100%);
      z-index: 999999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    .heart-pulse {
      font-size: 52px;
      animation: heartbeat 1.2s infinite ease-in-out;
      filter: drop-shadow(0 6px 12px rgba(139, 0, 0, 0.25));
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.18); }
      28% { transform: scale(1); }
      42% { transform: scale(1.22); }
      70% { transform: scale(1); }
    }
    .loading-title {
      margin-top: 22px;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #380811;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .loading-subtitle {
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 2.5px;
      color: #8C8074;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace, sans-serif;
    }
    .progress-bar-container {
      width: 180px;
      height: 3px;
      background: #EAE3D6;
      border-radius: 4px;
      margin-top: 24px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #D4AF37, #8B0000, #D4AF37);
      border-radius: 4px;
      position: absolute;
      animation: progress-slide 1.5s infinite ease-in-out;
    }
    @keyframes progress-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <!-- Instant HTML/CSS Loading Screen (Renders in <50ms while Flutter compiles & loads) -->
  <div id="loading-container">
    <div class="heart-pulse">🌻</div>
    <div class="loading-title">Our Love Story</div>
    <div class="loading-subtitle">Srinithi & Selvakumar</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loading-container');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.style.display = 'none';
        }, 300);
      }
    }

    // Unconditional safety timeout: guarantees loading screen fades out in <1.8s
    setTimeout(hideLoader, 1800);

    // 1. Flutter first frame event
    window.addEventListener('flutter-first-frame', hideLoader);

    // 2. High-speed DOM observer: detect canvas / flutter-view attachment immediately
    const domObserver = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
        hideLoader();
        domObserver.disconnect();
      }
    });
    domObserver.observe(document.body, { childList: true, subtree: true });

    // 3. Fallback: on window load
    window.addEventListener('load', function () {
      setTimeout(hideLoader, 500);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
